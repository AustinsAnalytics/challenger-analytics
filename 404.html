<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Challenger Analytics</title>
  <!-- GitHub Pages serves this for unknown paths: send visitors to the site's home page (pages use #/ addresses). -->
  <script>
    var base = location.pathname.split('/').slice(0, 2).join('/') + '/';
    location.replace(base + (location.hash || '#/'));
  </script>
  <style>body{background:#080b10;color:#a9b4c2;font:15px system-ui,sans-serif;text-align:center;padding:60px 16px}a{color:#d4f34a}</style>
</head>
<body>
  <p>Page not found. <a href="./">Go to Challenger Analytics</a></p>
</body>
</html>
